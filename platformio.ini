[platformio]
default_envs = dinaudio_m1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    git+https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.11

build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:dinaudio_m1]
build_type = release

[env:dinaudio_m1_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DDINAUDIO_DEBUG=1
